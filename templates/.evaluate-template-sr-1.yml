eval mm16 SR 1:
    stage: evaluate-sr-1
    tags:
        - cvmfs
    image:
        name: gitlab-registry.cern.ch/hkwon/notebooks:alma9  
    variables:
        DATE: ${DATE1}
        INPUT_DIR: ${INPUT_DUMP}
        ERA: mm16
        REGION: SR
        PART: one
    rules:    
        - if: $EVAL == 'yes' && $DUMP == 'yes' && $ONLY_BENCHMARK == 'yes'
          when: on_success
          variables:           # Override PART
            PART: "benchmark"  # at the job level.          
        - if: $EVAL == 'yes' && $DUMP == 'no' && $ONLY_BENCHMARK == 'yes'
          when: always
          variables:           # Override PART
            PART: "benchmark"  # at the job level.  
        - if: $EVAL == 'yes' && $DUMP == 'yes' && $ONLY_BENCHMARK == 'no'
          when: on_success       
        - if: $EVAL == 'yes' && $DUMP == 'no' && $ONLY_BENCHMARK == 'no'
          when: always                  
    needs:
        - job: dump mm16pre
          optional: true      
        - job: dump mm16post
          optional: true     
    script:
        - *script_eval16
        - *xrdcp_script 


########## stage: limit ############
##-- mm --##
limit mm16:
    stage: limit
    tags:
        - cvmfs
    variables:
        DATE: ${DATE1}
        ERA: mm16
        INPUT_DIR: ${INPUT_DNN}
    rules:    
        - if: $LIMIT == 'yes' && $EVAL == 'yes'
          when: on_success
        - if: $LIMIT == 'yes' && $EVAL == 'no'
          when: always
    needs:
        - job: eval mm16 SR 1
          optional: true 
        - job: eval mm16 SR 2
          optional: true
        - job: eval mm16 VR 1
          optional: true 
        - job: eval mm16 VR 2
          optional: true
    script:
        - *load_root_files
        - *set_combine
        - *script_limit 


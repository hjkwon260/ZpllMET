  - local: '/templates/.syst-template-sb.yml'

########## stage: impact ############
##-- mm --##
impact mm16:
    stage: impact
    tags:
        - cvmfs
    image:  
        name: gitlab-registry.cern.ch/cms-analysis/general/combine-container:CMSSW_11_3_4-combine_v9.1.0-harvester_v2.1.0
        entrypoint: ["/bin/sh", "-c"]
    variables:
        DATE: ${DATE1}
        ERA: mm16
        INPUT_DIR: ${INPUT_SYST}
        REGION: SR
        HOME_DIR: "/home/cmsusr/CMSSW_11_3_4/"        
    rules:    
        - if: $IMPACT == 'yes' && $SYST == 'yes'
          when: on_success
        - if: $IMPACT == 'yes' && $SYST == 'no'
          when: always
    # artifacts:
    #     when: on_success
    #     expire_in: 1 days
    #     paths:
    #         - ./combine/input/impacts.pdf
    needs:
        - job: syst mm16
          optional: true         
        - job: syst mm16 VR
          optional: true 
    script:
        - *set_combine
        - *combine_card_single_SF
        - *load_root_files_SF
        - *script_impacts
        - *xrdcp_script
        - kdestroy 


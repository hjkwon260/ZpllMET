    tags:
        - cvmfs
    image:  
        name: gitlab-registry.cern.ch/cms-analysis/general/combine-container:CMSSW_11_3_4-combine_v9.1.0-harvester_v2.1.0
        entrypoint: ["/bin/sh", "-c"]
    variables:
        DATE: ${DATE1}
        ERA: em
        INPUT_DIR: ${INPUT_SYST}
        REGION: SR
        HOME_DIR: "/home/cmsusr/CMSSW_11_3_4/"        
    rules:    
        - if: $IMPACT == 'yes' && $SYST == 'yes'
          when: on_success
        - if: $IMPACT == 'yes' && $SYST == 'no'
          when: always
    # artifacts:
    #     when: on_success
    #     expire_in: 1 days
    #     paths:
    #         - ./combine/input/impacts.pdf
    needs:
        - job: syst em18
          optional: true         
        - job: syst em18 VR
          optional: true 
    script:
        - *set_combine
        - *combine_card_channel
        - *load_root_files_all
        - *script_impacts
        - *xrdcp_script
        - kdestroy 

impact combine 1:
    stage: impact
    tags:
        - cvmfs
    image:  
        name: gitlab-registry.cern.ch/cms-analysis/general/combine-container:CMSSW_11_3_4-combine_v9.1.0-harvester_v2.1.0
        entrypoint: ["/bin/sh", "-c"]
    variables:
        DATE: ${DATE1}
        ERA: combine
        INPUT_DIR: ${INPUT_SYST}
        REGION: SR
        HOME_DIR: "/home/cmsusr/CMSSW_11_3_4/"        
    rules:    
        - if: $IMPACT == 'yes' && $SYST == 'yes'
          when: on_success
        - if: $IMPACT == 'yes' && $SYST == 'no'
          when: always
    # artifacts:
    #     when: on_success
    #     expire_in: 1 days
    #     paths:
    #         - ./combine/input/impacts.pdf
    needs:
        - job: syst em18
          optional: true         
        - job: syst em18 VR
          optional: true 
    script:
        - *set_combine
        - *combine_card_all
        - *load_root_files_all
        # - *script_impacts
        - text2workspace.py -m 125 -o workspace.root combined_datacard.txt
        # - combine -M FitDiagnostics workspace.root -m 125 --rMin -2 --rMax 2 --saveShapes --saveWithUncertainties        
        # b-only
        - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 --parallel 15 -t -1 --expectSignal 0 --doInitialFit
        - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 --parallel 15 -t -1 --expectSignal 0 --doFits
        - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 --parallel 15 -t -1 --expectSignal 0 --output impacts.json
        - plotImpacts.py -i impacts.json -o impacts        
        - *xrdcp_script
        - kdestroy 

impact combine 2:
    stage: impact
    tags:
        - cvmfs
    image:  
        name: gitlab-registry.cern.ch/cms-analysis/general/combine-container:CMSSW_11_3_4-combine_v9.1.0-harvester_v2.1.0
        entrypoint: ["/bin/sh", "-c"]
    variables:
        DATE: ${DATE1}
        ERA: combine
        INPUT_DIR: ${INPUT_SYST}
        REGION: SR
        HOME_DIR: "/home/cmsusr/CMSSW_11_3_4/"        
    rules:    
        - if: $IMPACT == 'yes' && $SYST == 'yes'
          when: on_success
        - if: $IMPACT == 'yes' && $SYST == 'no'
          when: always
    # artifacts:
    #     when: on_success
    #     expire_in: 1 days
    #     paths:
    #         - ./combine/input/impacts.pdf
    needs:
        - job: syst em18
          optional: true         
        - job: syst em18 VR
          optional: true 
    script:
        - *set_combine
        - *combine_card_all
        - *load_root_files_all
        # - *script_impacts
        - ValidateDatacards.py combined_datacard.txt 
        - text2workspace.py -m 125 -o workspace.root combined_datacard.txt
        # s+b
        - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 --parallel 10 -t -1 --expectSignal 1 --doInitialFit
        - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 --parallel 10 -t -1 --expectSignal 1 --doFits
        - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 --parallel 10 -t -1 --expectSignal 1 --output impactsS.json
        - plotImpacts.py -i impactsS.json -o impactsS        
        - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/IMPACT${MASS}/${ERA}/
        - xrdcp *.pdf ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/IMPACT${MASS}/${ERA}/
        - xrdcp *.json ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/IMPACT${MASS}/${ERA}/
        - kdestroy 

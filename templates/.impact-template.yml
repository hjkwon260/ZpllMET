.load_root_files: &load_root_files
    - mkdir SR
    - mkdir VR
    - xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/SR/root_files SR
    - if [ $ONLY_SR == "no" ]; then xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/VR/root_files VR; fi  

include:
  - local: '/templates/.syst-template.yml'

########## stage: impact ############
##-- em --##
impact em17:
    stage: impact
    tags:
        - cvmfs
    image:  
        name: gitlab-registry.cern.ch/cms-analysis/general/combine-container:CMSSW_11_3_4-combine_v9.1.0-harvester_v2.1.0
        entrypoint: ["/bin/sh", "-c"]
    variables:
        DATE: ${DATE1}
        ERA: em17
        INPUT_DIR: ${INPUT_SYST}
        REGION: SR
        HOME_DIR: "/home/cmsusr/CMSSW_11_3_4/"        
    rules:    
        - if: $IMPACT == 'yes' && $SYST == 'yes'
          when: on_success
        - if: $IMPACT == 'yes' && $SYST == 'no'
          when: always
    needs:
        - job: syst em17
          optional: true         
        - job: syst em17 VR
          optional: true 
    script:
        - source /cvmfs/cms.cern.ch/cmsset_default.sh
        - cd $HOME_DIR
        - cmsenv || true
        - cd $CI_PROJECT_DIR/Combine/input
        - *load_root_files
        - combineCards.py *.txt > combined_datacard.txt 
        - text2workspace.py -m 125 -o workspace.root combined_datacard.txt
        - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 --doInitialFit
        - kdestroy 
        - cd ${CI_PROJECT_DIR}
        - rm -rf ./*
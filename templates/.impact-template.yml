.load_root_files: &load_root_files
  - cd $CI_PROJECT_DIR/combine/input
  - mkdir SR
  - mkdir VR
  - xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/SR/root_files SR
  - if [ $ONLY_SR == "no" ]; then xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/VR/root_files VR; fi  

.combine_card_single: &combine_card_single
  - combineCards.py SR=${ERA}_template_SR.txt TTCR=${ERA}_template_TTCR.txt > combined_datacard.txt

.combine_card_channel: &combine_card_channel
  - combineCards.py SR16=${ERA}16_template_SR.txt TTCR16=${ERA}16_template_TTCR.txt SR17=${ERA}17_template_SR.txt TTCR17=${ERA}17_template_TTCR.txt SR18=${ERA}18_template_SR.txt TTCR18=${ERA}18_template_TTCR.txt > combined_datacard.txt

.combine_card_all: &combine_card_all
  - combineCards.py SR16=ee16_template_SR.txt TTCR16=ee16_template_TTCR.txt SR17=ee17_template_SR.txt TTCR17=ee17_template_TTCR.txt SR18=ee18_template_SR.txt TTCR18=ee18_template_TTCR.txt  SR16=mm16_template_SR.txt TTCR16=mm16_template_TTCR.txt SR17=mm17_template_SR.txt TTCR17=mm17_template_TTCR.txt SR18=mm18_template_SR.txt TTCR18=mm18_template_TTCR.txt  SR16=em16_template_SR.txt TTCR16=em16_template_TTCR.txt SR17=em17_template_SR.txt TTCR17=em17_template_TTCR.txt SR18=em18_template_SR.txt TTCR18=em18_template_TTCR.txt > combined_datacard.txt

.script_impacts: &script_impacts
  - ValidateDatacards.py combined_datacard.txt 
  - text2workspace.py -m 125 -o workspace.root combined_datacard.txt
  - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 -t -1 --expectSignal 0 --doInitialFit
  - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 -t -1 --expectSignal 0 --doFits
  - combineTool.py -M Impacts -m 125 -d workspace.root --rMin -2 --rMax 2 --robustFit 1 -t -1 --expectSignal 0 --output impacts.json
  - plotImpacts.py -i impacts.json -o impacts

.xrdcp_script: &xrdcp_script
  - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/IMPACT/${ERA}/
  - xrdcp impacts.pdf ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/IMPACT/${ERA}/
  - xrdcp *.json ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/IMPACT/${ERA}/
  - xrdcp combined_datacard.txt ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/IMPACT/${ERA}/

include:
  - local: '/templates/.syst-template-sb.yml'

########## stage: impact ############
##-- mm --##
impact mm16:
    stage: impact
    tags:
        - cvmfs
    image:  
        name: gitlab-registry.cern.ch/cms-analysis/general/combine-container:CMSSW_11_3_4-combine_v9.1.0-harvester_v2.1.0
        entrypoint: ["/bin/sh", "-c"]
    variables:
        DATE: ${DATE1}
        ERA: mm16
        INPUT_DIR: ${INPUT_SYST}
        REGION: SR
        HOME_DIR: "/home/cmsusr/CMSSW_11_3_4/"        
    rules:    
        - if: $IMPACT == 'yes' && $SYST == 'yes'
          when: on_success
        - if: $IMPACT == 'yes' && $SYST == 'no'
          when: always
    # artifacts:
    #     when: on_success
    #     expire_in: 1 days
    #     paths:
    #         - ./combine/input/impacts.pdf
    needs:
        - job: syst mm16
          optional: true         
        - job: syst mm16 VR
          optional: true 
    script:
        - source /cvmfs/cms.cern.ch/cmsset_default.sh
        - cd $HOME_DIR
        - cmsenv || true
        - cd $CI_PROJECT_DIR/combine/input
        - *combine_card_single
        - *load_root_files
        - *script_impacts
        - *xrdcp_script
        - kdestroy 


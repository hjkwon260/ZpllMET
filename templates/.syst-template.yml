.load_root_files: &load_root_files
    - mkdir SR
    - mkdir VR
    - xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/SR/root_files SR
    # - xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/VR/root_files VR 

.syst_script: &syst_script
    - *load_root_files
    # - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
    # - mkdir -p ~/Rpackages
    # - pip3 install numpy rpy2 jupyterlab
    - R --version
    # - Rscript -e 'install.packages("BiocManager", repos="http://cran.rstudio.com/")' && Rscript -e 'BiocManager::install("limma")'    
    # - Rscript install.R
    - ls ~/Rpackages
    - export LD_LIBRARY_PATH=""    
    - jupyter nbconvert --to python SystematicPlots_v1.ipynb
    - python3 SystematicPlots_v1.py . ${ERA} ${REGION}
    - export PATH="$PATH:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/bin"
    - export LD_LIBRARY_PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/biglib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/lib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/lib:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/llvm/11.1.0-llifpc/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib"

.xrdcp_script: &xrdcp_script
    - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/SYST/${ERA}/SR/root_files
    - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/SYST/${ERA}/SR/AN
    - xrdcp Outputs/Syst/${ERA}/SR/*.pdf ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/SYST/${ERA}/SR/
    - xrdcp -r Outputs/Syst/${ERA}/SR/root_files ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DNN/${ERA}/SR/root_files
    - xrdcp -r Outputs/Syst/${ERA}/SR/AN ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DNN/${ERA}/SR/AN
    - kdestroy 
    - cd ${CI_PROJECT_DIR}
    - rm -rf ./*

include:
  - local: '/templates/.evaluate-template.yml'

########## stage: syst ############
##-- mm --##
syst mm16:
    stage: syst
    tags:
        - cvmfs
    # image:
    #   name: gitlab-registry.cern.ch/hkwon/myawsomeproject:R
    variables:
        DATE: ${DATE1}
        ERA: mm16
        INPUT_DIR: ${INPUT_DNN}
        REGION: SR
    rules:    
        - if: $SYST == 'yes' && $EVAL == 'yes'
          when: on_success
        - if: $SYST == 'yes' && $EVAL == 'no'
          when: always
    needs:
        - job: eval mm16 SR 1
          optional: true 
        - job: eval mm16 SR 2
          optional: true
        - job: eval mm16 VR 1
          optional: true 
        - job: eval mm16 VR 2
          optional: true
    script:
        - *syst_script
        - *xrdcp_script



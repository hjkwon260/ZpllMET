.load_root_files: &load_root_files
    - mkdir SR
    - mkdir VR
    - xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/SR/root_files SR
    # - xrdcp -r -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/VR/root_files VR 

.syst_script: &syst_script
    - *load_root_files
    - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
    - mkdir -p ~/Rpackages
    - pip install rpy2
    - Rscript install.R
    - jupyter nbconvert --to python SystematicPlots_v1.ipynb
    - python SystematicPlots_v1.py . ${ERA} ${REGION}
    - xrdcp -r Outputs/Syst ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/Presel/
    - kdestroy 
    - cd ${CI_PROJECT_DIR}
    - ls
    - rm -rf ./*
    - ls        

include:
  - local: '/templates/.evaluate-template.yml'

########## stage: syst ############
##-- mm --##
syst mm16:
    stage: syst
    tags:
        - cvmfs
    image:
      name: gitlab-registry.cern.ch/hkwon/myawsomeproject:R
    variables:
        DATE: ${DATE1}
        ERA: mm16
        INPUT_DIR: ${INPUT_DNN}
        REGION: SR
    rules:    
        - if: $SYST == 'yes' && $EVAL == 'yes'
          when: on_success
        - if: $SYST == 'yes' && $EVAL == 'no'
          when: always
    needs:
        - job: eval mm16 SR 1
          optional: true 
        - job: eval mm16 SR 2
          optional: true
        - job: eval mm16 VR 1
          optional: true 
        - job: eval mm16 VR 2
          optional: true
    script:
        - *syst_script


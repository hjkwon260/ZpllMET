##-- mm --##
syst mm16:
    stage: syst
    tags:
        - cvmfs
    image:
        name: gitlab-registry.cern.ch/hkwon/notebooks:alma9  
    variables:
        DATE: ${DATE1}
        ERA: mm16
        INPUT_DIR: ${INPUT_DNN}
        REGION: SR
    rules:    
        - if: $SYST == 'yes' && $EVAL == 'yes'
          when: on_success
        - if: $SYST == 'yes' && $EVAL == 'no'
          when: always
    needs:
        - job: eval mm16 SR 1
          optional: true 
        - job: eval mm16 SR 2
          optional: true
        - job: eval mm16 VR 1
          optional: true 

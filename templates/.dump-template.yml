.script_dump: &script_dump
    - xrdcp -r -v -F ${ROOT_EOS_USER}/${INPUT_DIR} .  
    - source /cvmfs/sft.cern.ch/lcg/views/LCG_103swan/x86_64-centos7-gcc11-opt/setup.sh
    # - source /cvmfs/sft.cern.ch/lcg/views/LCG_100/x86_64-centos7-gcc8-opt/setup.sh
    - jupyter nbconvert --to python ${SCRIPT_DUMP}.ipynb 
    - python ${SCRIPT_DUMP}.py ${ERA} ${DATE} ${CI_PROJECT_DIR}/${CHANNEL}
    - xrdcp -r ${DATE}/ ${ROOT_EOS_USER}/Run2/Preselection
    - kdestroy 
    
########## stage: dump ############
##-- mm --##
dump mm16pre:
    stage: dump
    tags:
        - cvmfs
    variables:
        DATE: ${DATE1}
        INPUT_DIR: Run2/${DATE1}_16pre/mm/
        ERA: mm16pre
        CHANNEL: mm/    
    rules:
        - if: $DUMP == 'yes'          
    script:
        - *script_dump 


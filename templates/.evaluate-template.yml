.load16: &load16
    - mkdir ${ERA}pre
    - mkdir ${ERA}post
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}pre/nested_dic_df_SR1.pkl ${ERA}pre  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}pre/nested_dic_df_TTCR.pkl ${ERA}pre  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}post/nested_dic_df_SR1.pkl ${ERA}post  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}post/nested_dic_df_TTCR.pkl ${ERA}post

.load: &load
    - mkdir ${ERA}
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/nested_dic_df_SR1.pkl ${ERA}  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/nested_dic_df_TTCR.pkl ${ERA} 

.script_eval16: &script_eval16
    - *load16
    # - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
    # - pip3 install numpy uproot pandas tqdm jupyterlab tensorflow scikit-learn seaborn
    - pip3 install uproot pandas tqdm jupyterlab tensorflow scikit-learn seaborn
    - echo $PYTHONPATH
    - export LD_LIBRARY_PATH=""    
    - jupyter nbconvert --to python ${SCRIPT_EVAL}.ipynb
    - python3 ${SCRIPT_EVAL}.py . ${ERA} ${REGION} ${PART}
    - export PATH="$PATH:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/bin"
    - export LD_LIBRARY_PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/biglib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/lib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/lib:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/llvm/11.1.0-llifpc/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib"


.script_eval: &script_eval
    - *load
    # - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
    - jupyter nbconvert --to python ${SCRIPT_EVAL}.ipynb
    - python3 ${SCRIPT_EVAL}.py . ${ERA} ${REGION} ${PART}
    - xrdcp -r Outputs/DNN ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/Presel/
    - kdestroy

include:
  - local: '/templates/.draw-template.yml'

########## stage: evaluate ############
##-- mm --##
eval mm16 SR 1:
    stage: evaluate
    tags:
        - cvmfs
    variables:
        DATE: ${DATE1}
        INPUT_DIR: ${INPUT_DUMP}
        ERA: mm16
        REGION: SR
        PART: one
    rules:    
        - if: $EVAL == 'yes' && $DUMP == 'yes'
          when: on_success
        - if: $EVAL == 'yes' && $DUMP == 'no'
          when: always
    needs:
        - job: dump mm16pre
          optional: true      
        - job: dump mm16post
          optional: true     
    script:
        - *script_eval16 
        - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/DNN/${ERA}/SR/sys
        - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/DNN/${ERA}/SR/root_files
        - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/DNN/${ERA}/SR/AN
        - xrdcp -r Outputs/DNN/${ERA}/SR/sys ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DNN/${ERA}/SR/sys
        - xrdcp -r Outputs/DNN/${ERA}/SR/root_files ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DNN/${ERA}/SR/root_files
        - xrdcp -r Outputs/DNN/${ERA}/SR/AN ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DNN/${ERA}/SR/AN
        - kdestroy

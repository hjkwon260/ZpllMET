include:
  - local: '/templates/.evaluate-template-sr.yml'

########## stage: evaluate ############
#####-- VR --#####
##-- mm --##
eval mm16 VR 1:
    stage: evaluate-vr
    tags:
        - cvmfs
    image:
        name: gitlab-registry.cern.ch/hkwon/notebooks:alma9  
    variables:
        DATE: ${DATE1}
        INPUT_DIR: ${INPUT_DUMP}
        ERA: mm16
        REGION: VR
        PART: one
    rules:    
        - if: $EVAL_VR == 'yes' && $DUMP == 'yes' && $ONLY_BENCHMARK == 'yes' && $ONLY_SR == 'no'
          when: on_success
          variables:           # Override PART
            PART: "benchmark"  # at the job level.          
        - if: $EVAL_VR == 'yes' && $DUMP == 'no' && $ONLY_BENCHMARK == 'yes' && $ONLY_SR == 'no'
          when: always
          variables:           # Override PART
            PART: "benchmark"  # at the job level.  
        - if: $EVAL_VR == 'yes' && $DUMP == 'yes' && $ONLY_BENCHMARK == 'no' && $ONLY_SR == 'no'
          when: on_success       
        - if: $EVAL_VR == 'yes' && $DUMP == 'no' && $ONLY_BENCHMARK == 'no' && $ONLY_SR == 'no'
          when: always  
    needs:
        - job: eval mm16 SR 1
          optional: true        
    script:
        - *script_eval16 
        - *xrdcp_script 
       
eval mm16 VR 2:
    stage: evaluate-vr

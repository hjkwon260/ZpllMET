.load16: &load16
    # - mkdir ${ERA}pre
    # - mkdir ${ERA}post
    - xrdcp -v -r ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}pre/ .  
    - xrdcp -v -r ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}post/ .
    - ls ${ERA}pre 

.load: &load
    # - mkdir ${ERA}
    - xrdcp -v -r ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/ . 
    - ls 
    - ls ${ERA}

.script_draw16: &script_draw16
    - echo $PYTHONPATH
    - export LD_LIBRARY_PATH=""      
    - jupyter nbconvert --to python ${SCRIPT_DRAW}.ipynb 
    - python3 ${SCRIPT_DRAW}.py ${ERA} ${DATE} ${CI_PROJECT_DIR} ${PART} ${REGION_DRAW}
    - export PATH="$PATH:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/bin"
    - export LD_LIBRARY_PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/biglib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/lib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/lib:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/llvm/11.1.0-llifpc/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib"

.script_draw: &script_draw
    - echo $PYTHONPATH
    - export LD_LIBRARY_PATH=""      
    - jupyter nbconvert --to python ${SCRIPT_DRAW}.ipynb 
    - python3 ${SCRIPT_DRAW}.py ${ERA} ${DATE} ${CI_PROJECT_DIR} ${PART} ${REGION_DRAW}
    - export PATH="$PATH:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/bin"
    - export LD_LIBRARY_PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/biglib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/lib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/lib:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/llvm/11.1.0-llifpc/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib"

.xrdcp_script: &xrdcp_script
    - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/DRAW/${ERA}/${REGION_DRAW}/sys
    - xrdfs ${ROOT_EOS_USER} mkdir -p /eos/user/h/hkwon/Run2/Preselection/${DATE}/DRAW/${ERA}/${REGION_DRAW}/AN
    - xrdcp -r ${DATE}/Presel/DRAW/${ERA}/${REGION_DRAW}/sys ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DRAW/${ERA}/${REGION_DRAW}/sys
    - xrdcp -r ${DATE}/Presel/DRAW/${ERA}/${REGION_DRAW}/AN ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DRAW/${ERA}/${REGION_DRAW}/AN
    - xrdcp  ${DATE}/Presel/DRAW/${ERA}/${REGION_DRAW}/*.pdf ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/DRAW/${ERA}/${REGION_DRAW}/
    # - kdestroy

include:
  - local: '/templates/.draw-template.yml'    

########## stage: draw ############
##-- mm --##
draw mm16 SB:
    stage: draw
    tags:
        - cvmfs
    image:
        name: gitlab-registry.cern.ch/hkwon/notebooks:alma9 
    variables:
        DATE: ${DATE1}
        INPUT_DIR: ${INPUT_DUMP}
        ERA: mm16
        PART: DYMET
        REGION: ${REGION_DRAW}
    rules:
        - if: $DRAW_SB == 'yes' && $DUMP == 'yes'
          when: on_success
        - if: $DRAW_SB == 'yes' && $DUMP == 'no'
          when: always
    needs:
        - job: dump mm16pre
          optional: true      
        - job: dump mm16post
          optional: true
    script:
        - *load16
        - *script_draw16 
        - *xrdcp_script
        - kdestroy


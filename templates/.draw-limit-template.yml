stages:
    - draw limit
########## stage: draw limit ############
##-- mm --##
draw mm16:
    stage: draw limit
    tags:
        - cvmfs
    variables:
        DATE: ${DATE1}
        ERA: mm16
    rules:    
        - if: $DRAW_LIMIT == 'yes' && $LIMIT == 'yes'
          when: on_success
        - if: $DRAW_LIMIT == 'yes' && $LIMIT == 'no'
          when: always
    needs:
        - job: limit mm16
          optional: true            
    script:
        - *script_draw_limit


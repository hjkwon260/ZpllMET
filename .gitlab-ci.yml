variables: #testtest
    DATE1: 20230529deepCSV
    CMS_PATH: /cvmfs/cms.cern.ch
    CMSSW_RELEASE: CMSSW_10_2_13
    CMSSW_ARCH: slc7_amd64_gcc700
    SCRIPT_PRESEL: Preselection_v6  
    SCRIPT_EVAL: EvaluatePNN-v3  
    SCRIPT_LIMIT: limits_v4  
    SCRIPT_DUMP: Dump_v1  
    SCRIPT_DRAW: Draw_v1  
    DUMP: 'no'
    DRAW: 'no'
    EVAL: 'no'
    LIMIT: 'yes'
    DRAW_LIMIT: 'yes'
    INPUT_DUMP: Run2/Preselection/${DATE1}/Presel/DUMP/
    INPUT_DNN: Run2/Preselection/${DATE1}/Presel/DNN/
#     INPUT_DIR: Run2/20221225_17/ee/
#     DATE: 20221225
#     ERA: ee17
# include:
#   - local: run.yml
before_script:
    - cat /proc/meminfo
    - export PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/bin:$PATH"
    - export LD_LIBRARY_PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/biglib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/lib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/lib:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/llvm/11.1.0-llifpc/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib"
    - printf $PASS | base64 -d | kinit $USER@CERN.CH

.script_dump: &script_dump
    - xrdcp -r -v -F ${ROOT_EOS_USER}/${INPUT_DIR} .  
    - source /cvmfs/sft.cern.ch/lcg/views/LCG_100/x86_64-centos7-gcc8-opt/setup.sh
    - jupyter nbconvert --to python ${SCRIPT_DUMP}.ipynb 
    - python ${SCRIPT_DUMP}.py ${ERA} ${DATE} ${CI_PROJECT_DIR}/${CHANNEL}
    - xrdcp -r ${DATE}/ ${ROOT_EOS_USER}/Run2/Preselection
    - kdestroy 

.load16: &load16
    - mkdir ${ERA}pre
    - mkdir ${ERA}post
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}pre/nested_dic_df_SR1.pkl ${ERA}pre  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}pre/nested_dic_df_TTCR.pkl ${ERA}pre  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}post/nested_dic_df_SR1.pkl ${ERA}post  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}post/nested_dic_df_TTCR.pkl ${ERA}post

.load: &load
    - mkdir ${ERA}
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/nested_dic_df_SR1.pkl ${ERA}  
    - xrdcp -v ${ROOT_EOS_USER}/${INPUT_DIR}/${ERA}/nested_dic_df_TTCR.pkl ${ERA}  

.script_draw16: &script_draw16
    - *load16
    - source /cvmfs/sft.cern.ch/lcg/views/LCG_100/x86_64-centos7-gcc8-opt/setup.sh
    - jupyter nbconvert --to python ${SCRIPT_DRAW}.ipynb 
    - python ${SCRIPT_DRAW}.py ${ERA} ${DATE} ${CI_PROJECT_DIR}
    - xrdcp -r ${DATE}/ ${ROOT_EOS_USER}/Run2/Preselection
    - kdestroy 

.script_draw: &script_draw
    - *load
    - source /cvmfs/sft.cern.ch/lcg/views/LCG_100/x86_64-centos7-gcc8-opt/setup.sh
    - jupyter nbconvert --to python ${SCRIPT_DRAW}.ipynb 
    - python ${SCRIPT_DRAW}.py ${ERA} ${DATE} ${CI_PROJECT_DIR}
    - xrdcp -r ${DATE}/ ${ROOT_EOS_USER}/Run2/Preselection
    - kdestroy

.script_eval16: &script_eval16
    - *load16
    - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
    - jupyter nbconvert --to python ${SCRIPT_EVAL}.ipynb
    - python ${SCRIPT_EVAL}.py . ${ERA} ${REGION} ${PART}
    - xrdcp -r Outputs/DNN ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/Presel/
    - kdestroy

.script_eval: &script_eval
    - *load
    - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
    - jupyter nbconvert --to python ${SCRIPT_EVAL}.ipynb
    - python ${SCRIPT_EVAL}.py . ${ERA} ${REGION} ${PART}
    - xrdcp -r Outputs/DNN ${ROOT_EOS_USER}/Run2/Preselection/${DATE}/Presel/
    - kdestroy

stages:
    - dump
    - draw
    # - presel
    # - merge
    - evaluate
    - limit
    - draw limit


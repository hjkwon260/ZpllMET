##-- mm --##
eval mm16 SR 1:
    stage: evaluate
    tags:
        - cvmfs
    variables:
        DATE: ${DATE1}
        INPUT_DIR: ${INPUT_DUMP}
        ERA: mm16
        REGION: SR
        PART: one
    rules:    
        - if: $EVAL == 'yes' && $DUMP == 'yes'
          when: on_success
        - if: $EVAL == 'yes' && $DUMP == 'no'
          when: always
    needs:
        - job: dump mm16pre
          optional: true      
        - job: dump mm16post
          optional: true     
    script:
        - *script_eval16 


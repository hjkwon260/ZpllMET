eval mm16pre:
    stage: evaluate
    tags:
        - cvmfs
    variables:
        INPUT_DIR: Run2/Preselection/${DATE1}/Presel/mm16pre/
        DATE: ${DATE1}
        ERA: mm16pre
        CHANNEL: mm/ 
    needs:
        - job: mm16pre        
    artifacts:
        paths:
            - Outputs/
        exclude:
            - ${DATE}/Presel/**/*.pkl
        expire_in: 10 min            
    script:
        - printf $PASS | base64 -d | kinit $USER@CERN.CH
        - xrdcp -r ${ROOT_EOS_USER}/${INPUT_DIR}/*.pkl .  2>/dev/null
        - source /cvmfs/sft.cern.ch/lcg/views/LCG_100/x86_64-centos7-gcc8-opt/setup.sh
        - jupyter nbconvert --to python Evaluate-v2.ipynb
        - python Evaluate-v2.py
        # - xrdcp -r ${DATE}/ ${ROOT_EOS_USER}/Run2/Preselection
        - kdestroy                                                
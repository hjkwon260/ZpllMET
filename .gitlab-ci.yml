variables:
    DATE1: 20230529deepCSV
    CMS_PATH: /cvmfs/cms.cern.ch
    CMSSW_RELEASE: CMSSW_10_2_13
    CMSSW_ARCH: slc7_amd64_gcc700
    SCRIPT_PRESEL: Preselection_v6  
    SCRIPT_EVAL: EvaluatePNN-v3  
    SCRIPT_LIMIT: limits_v3  
#     #INPUT_DIR: 20220215/ #20220131/
#     INPUT_DIR: Run2/20221225_17/ee/
#     DATE: 20221225
#     ERA: ee17
# include:
#   - local: run.yml
before_script:
    - cat /proc/meminfo
    - export PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/bin:$PATH"
    - export LD_LIBRARY_PATH="/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/biglib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/lib/slc7_amd64_gcc900:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/cms/cmssw/CMSSW_11_3_2/external/slc7_amd64_gcc900/lib:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/llvm/11.1.0-llifpc/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib64:/cvmfs/cms.cern.ch/slc7_amd64_gcc900/external/gcc/9.3.0/lib"

.set_combine: &set_combine
    - shopt -s expand_aliases
    - set +u && source ${CMS_PATH}/cmsset_default.sh; set -u
    - cmsrel ${CMSSW_RELEASE}
    - cd ${CMSSW_RELEASE}/src
    - cmsenv
    - git clone https://github.com/cms-analysis/HiggsAnalysis-CombinedLimit.git HiggsAnalysis/CombinedLimit
    - cd HiggsAnalysis/CombinedLimit
    - cd $CMSSW_BASE/src/HiggsAnalysis/CombinedLimit
    - git fetch origin
    - git checkout v8.1.0
    - cd $CMSSW_BASE/src
    - bash <(curl -s https://raw.githubusercontent.com/cms-analysis/CombineHarvester/master/CombineTools/scripts/sparse-checkout-https.sh)
    - scram b -j 20

stages:
    - evaluate

eval ee16 SR 1:
    stage: evaluate
    tags:
        - cvmfs
    variables:
        INPUT_DIR: Run2/Preselection/${DATE1}/Presel/ee16/
        DATE: ${DATE1}
        ERA: ee16
        CHANNEL: ee/        
    artifacts:
        paths:
            - Outputs/
        exclude:
            - ${DATE}/Presel/**/*.pkl
        expire_in: 10 min            
    script:
        - printf $PASS | base64 -d | kinit $USER@CERN.CH
        - echo ${INPUT_DIR}
        - xrdcp ${ROOT_EOS_USER}/${INPUT_DIR}/nested_dic_df_SR1.pkl ${CI_PROJECT_DIR}
        - xrdcp ${ROOT_EOS_USER}/${INPUT_DIR}/nested_dic_df_TTCR.pkl ${CI_PROJECT_DIR}
        - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
        - jupyter nbconvert --to python ${SCRIPT_EVAL}.ipynb
        - python ${SCRIPT_EVAL}.py ${ERA} SR one
        - xrdcp -r Outputs/SR ${ROOT_EOS_USER}/${INPUT_DIR}
        - kdestroy  


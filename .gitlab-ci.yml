eval ee16post:
    stage: evaluate
    tags:
        - cvmfs
    variables:
        INPUT_DIR: Run2/Preselection/${DATE1}/Presel/ee16post/
        DATE: ${DATE1}
        ERA: ee16post
        CHANNEL: ee/ 
    needs:
        - job: ee16post        
    artifacts:
        paths:
            - Outputs/
        exclude:
            - ${DATE}/Presel/**/*.pkl
        expire_in: 10 min            
    script:
        - printf $PASS | base64 -d | kinit $USER@CERN.CH
        - echo ${INPUT_DIR}
        - xrdcp -r ${ROOT_EOS_USER}/${INPUT_DIR} ${CI_PROJECT_DIR}  2>/dev/null
        - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
        - jupyter nbconvert --to python EvaluatePNN-v2.ipynb
        - python EvaluatePNN-v2.py ${ERA} SR
        - python EvaluatePNN-v2.py ${ERA} VR
        - xrdcp -r Outputs/SR ${ROOT_EOS_USER}/${INPUT_DIR}
        - xrdcp -r Outputs/VR ${ROOT_EOS_USER}/${INPUT_DIR}
        - kdestroy  


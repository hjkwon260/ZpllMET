    tags:
        - cvmfs
    variables:
        DATE: ${DATE1}
        INPUT_DIR: ${INPUT_DUMP}
        ERA: ee16
    rules:
        - if: $DRAW == 'yes' && $DUMP == 'yes'
          when: on_success
        - if: $DRAW == 'yes' && $DUMP == 'no'
          when: always

draw ee16:
    stage: draw
    tags:
        - cvmfs
    variables:
        INPUT_DIR: Run2/Preselection/${DATE1}/Presel/ee16/
        DATE: ${DATE1}
        ERA: ee16post
        CHANNEL: ee/ 
    needs:
        - job: limit ee16        
    artifacts:
        paths:
            - Combine/Plots    
        exclude:
            - ${DATE}/Presel/**/*.pkl
        expire_in: 10 min            
    script:
        - printf $PASS | base64 -d | kinit $USER@CERN.CH
        - source /cvmfs/sft.cern.ch/lcg/views/LCG_102b_swan/x86_64-centos7-gcc11-opt/setup.sh
        - jupyter nbconvert --to python 2Dlimit.ipynb
        - python 2Dlimit.py ${ERA}   
        - xrdcp -r Combine/ ${ROOT_EOS_USER}/${INPUT_DIR}
        - kdestroy 

